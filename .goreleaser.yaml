version: 2

project_name: ifscope

before:
  hooks:
    - go mod tidy

builds:
  - id: ifscope
    main: ./cmd/ifscope
    binary: ifscope
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/bgrewell/ifscope/internal/version.Version={{.Version}}
      - -X github.com/bgrewell/ifscope/internal/version.Commit={{.ShortCommit}}
      - -X github.com/bgrewell/ifscope/internal/version.Date={{.Date}}

archives:
  - id: ifscope
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
